---
- name: Deploy apps to EC2
  hosts: myhosts
  become: true
  vars:
    ansible_aws_ssm_instance_id: "{{ instance_id }}"
    ansible_connection: aws_ssm
    ansible_aws_ssm_bucket_name: "{{ ansible_ssm_bucket_name }}"
    ansible_aws_ssm_region: ap-southeast-1
    ansible_aws_ssm_profile: admin-access

  tasks:
    - name: Docker installation tasks
      ansible.builtin.import_tasks: install-docker.yaml

    - name: App setup tasks
      ansible.builtin.import_tasks: app-setup.yaml
