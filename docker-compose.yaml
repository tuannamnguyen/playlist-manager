services:
  fe:
    image: tuannamnguyen290602/playlist-manager-frontend
    ports:
      - 4040:8080
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - prod_with_fe

  app:
    build:
      dockerfile: Dockerfile
      context: .
    environment:
      - DOTENV_PRIVATE_KEY_PROD=${DOTENVX_PRIVATE_KEY}
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 5s
      timeout: 10s
      retries: 3
    ports:
      - 8080:8080
    profiles:
      - prod_app_only
      - prod

  app_test:
    build:
      dockerfile: Dockerfile.test
      context: .
    volumes:
      - type: bind
        source: ~/.aws
        target: /root/.aws
        read_only: true
    environment:
      - DOTENV_PRIVATE_KEY_TEST=${DOTENVX_PRIVATE_KEY}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthcheck" ]
      interval: 5s
      timeout: 10s
      retries: 3
    ports:
      - 8080:8080
    profiles:
      - test_minimal

  db:
    image: postgres:16
    env_file: ./cmd/api/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=playlist_manager
    healthcheck:
      test: [ "CMD-SHELL", "psql -U postgres -d postgres -c 'SELECT 1' || exit 1" ]
      interval: 1s
      timeout: 3s
      retries: 5
    profiles:
      - prod
      - test
      - test_minimal

  redis:
    image: redis:7
    command: redis-server --save 60 1 --loglevel warning
    restart: on-failure:3
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    profiles:
      - prod
      - prod_app_only
      - test
      - test_minimal

  redis_ui:
    image: redis/redisinsight
    volumes:
      - redisinsight:/data
    ports:
      - 5540:5540
    profiles:
      - test

  pgadmin4:
    image: elestio/pgadmin:latest
    env_file: ./cmd/api/.env
    volumes:
      - ./config/servers.json:/pgadmin4/servers.json
    ports:
      - 5433:5433
    profiles:
      - test

volumes:
  pgdata:
  redisinsight:
